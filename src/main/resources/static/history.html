<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeatSync | My Bookings</title>
<style>
*{box-sizing:border-box}
:root{
--primary:#5b4bea;
--primary-dark:#29234f;
--background:#f5f6fc;
--text:#252442;
--muted:#77778e;
--border:#e9e8f2;
}
body{margin:0;font-family:Arial,sans-serif;background:var(--background);color:var(--text)}
header{background:white;padding:19px 7%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;box-shadow:0 3px 15px #25204f0c}
.logo{color:var(--primary);font-size:27px;font-weight:bold;text-decoration:none}
nav{display:flex;flex-wrap:wrap;gap:22px}
nav a{color:#55536d;text-decoration:none;font-weight:bold;font-size:14px}
nav a:hover{color:var(--primary)}
.container{width:90%;max-width:1150px;margin:38px auto}
.page-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:26px}
h1{margin:0 0 10px;font-size:30px}
.subtitle{color:var(--muted);line-height:1.6;margin:0}
button,input,select{font:inherit}
button{cursor:pointer}
.refresh-btn,.explore-link{border:none;border-radius:9px;background:var(--primary);color:white;padding:12px 19px;font-weight:bold;text-decoration:none;display:inline-block}
.refresh-btn:hover,.explore-link:hover{background:#4938d4}
.refresh-btn:disabled{opacity:.6;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:white;border:1px solid var(--border);border-radius:14px;padding:21px;box-shadow:0 4px 14px #25204f06}
.stat-label{color:var(--muted);font-size:13px;margin-bottom:12px}
.stat-number{font-size:27px;font-weight:bold}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.toolbar input,.toolbar select{background:white;border:1px solid #deddea;border-radius:9px;padding:12px 14px;color:var(--text);outline:none}
.toolbar input{flex:1;min-width:220px}
.toolbar select{min-width:170px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary)}
#message{margin:18px 0;color:var(--muted);line-height:1.6}
.booking-card{background:white;border:1px solid var(--border);border-radius:16px;margin-bottom:20px;overflow:hidden;box-shadow:0 5px 18px #25204f08}
.card-header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding:20px 24px;background:#fcfcff;border-bottom:1px solid var(--border)}
.reference-label{color:var(--muted);font-size:12px;margin-bottom:7px}
.reference{color:var(--primary);font-size:16px;font-weight:bold;overflow-wrap:anywhere}
.status{display:inline-block;padding:8px 13px;border-radius:30px;font-size:12px;font-weight:bold;background:#fff0cc;color:#805600}
.status.CONFIRMED{background:#dcf8e6;color:#187442}
.status.CANCELLED{background:#ffe3e3;color:#b42323}
.status.EXPIRED{background:#eeeeF4;color:#5b5b70}
.card-content{padding:24px}
.movie-heading{margin:0 0 8px;font-size:21px;color:var(--primary-dark)}
.movie-subtitle{margin:0 0 22px;color:var(--muted);font-size:14px}
.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 20px}
.detail-label{color:var(--muted);font-size:12px;margin-bottom:8px}
.detail-value{font-size:14px;font-weight:bold;overflow-wrap:anywhere;line-height:1.5}
.seats{display:inline-block;background:#efedff;color:#4938d4;border-radius:7px;padding:6px 10px;letter-spacing:.5px}
.amount{color:var(--primary);font-size:18px}
.card-footer{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding:17px 24px;border-top:1px solid var(--border)}
.booking-date{color:var(--muted);font-size:12px;line-height:1.6}
.cancel-btn{background:white;border:1px solid #efb9bd;color:#c12e3c;border-radius:8px;padding:10px 15px;font-weight:bold}
.cancel-btn:hover:not(:disabled){background:#fff0f0}
.cancel-btn:disabled{opacity:.6;cursor:not-allowed}
.ticket-actions{display:flex;gap:10px;flex-wrap:wrap}
.ticket-btn{border:none;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer;background:var(--primary);color:white}
.ticket-btn:hover{background:#4938d4}
.download-ticket{background:#16845b}
.download-ticket:hover{background:#106b48}
.empty{text-align:center;background:white;border:1px solid var(--border);border-radius:15px;padding:55px 20px}
.empty-icon{font-size:42px;margin-bottom:15px}
.empty h2{margin:0 0 10px}
.empty p{color:var(--muted);margin-bottom:22px}
footer{margin-top:55px;background:var(--primary-dark);color:#dedbf9;text-align:center;padding:24px;font-size:13px}
@media(max-width:800px){
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.details{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:500px){
header{padding:18px 5%}
nav{gap:14px}
.container{width:92%;margin:26px auto}
h1{font-size:25px}
.stats{gap:10px}
.stat-card{padding:16px}
.stat-number{font-size:23px}
.details{grid-template-columns:1fr 1fr;gap:20px 12px}
.card-header,.card-content,.card-footer{padding:17px}
.toolbar input,.toolbar select{width:100%;min-width:0}
.cancel-btn{width:100%}
.ticket-actions{width:100%}
.ticket-btn{flex:1}
}
</style>
</head>
<body>
<header>
<a class="logo" href="/index.html">SeatSync.</a>
<nav>
<a href="/index.html">Home</a>
<a href="/dashboard.html">Dashboard</a>
<a href="/movies.html">Explore Movies</a>
<a href="/events.html">Events</a>
<a href="/hotels.html">Hotels</a>
</nav>
</header>
<main class="container">
<section class="page-heading">
<div>
<h1>My Bookings</h1>
<p class="subtitle">Manage your reservations and view your ticket details.</p>
</div>
<button class="refresh-btn" id="refreshButton" type="button">↻ Refresh Bookings</button>
</section>
<section class="stats">
<div class="stat-card">
<div class="stat-label">Total Bookings</div>
<div class="stat-number" id="totalCount">—</div>
</div>
<div class="stat-card">
<div class="stat-label">Pending</div>
<div class="stat-number" id="pendingCount">—</div>
</div>
<div class="stat-card">
<div class="stat-label">Confirmed</div>
<div class="stat-number" id="confirmedCount">—</div>
</div>
<div class="stat-card">
<div class="stat-label">Cancelled</div>
<div class="stat-number" id="cancelledCount">—</div>
</div>
</section>
<section class="toolbar">
<input type="search" id="searchInput"
placeholder="Search by reference, movie, event, hotel, or venue..."
aria-label="Search bookings">
<select id="statusFilter">
<option value="ALL">All statuses</option>
<option value="PENDING">Pending</option>
<option value="CONFIRMED">Confirmed</option>
<option value="CANCELLED">Cancelled</option>
<option value="EXPIRED">Expired</option>
</select>
</section>
<p id="message" role="status" aria-live="polite">Loading your bookings...</p>
<section id="bookingList"></section>
</main>
<footer>© 2026 SeatSync. All rights reserved.</footer>
<script>
const list = document.getElementById("bookingList");
const message = document.getElementById("message");
const refreshButton = document.getElementById("refreshButton");
const searchInput = document.getElementById("searchInput");
const statusFilter = document.getElementById("statusFilter");
let allBookings = [];
let allEvents = [];
let allHotels = [];

function getCustomerName(){
    const keys = ["seatsyncName","customerName","userName","username","name"];
    for(const key of keys){
        const value = sessionStorage.getItem(key);
        if(value && value.trim()) return value.trim();
    }
    return "";
}

function addDetail(parent,label,value,extraClass=""){
    const box = document.createElement("div");
    const title = document.createElement("div");
    title.className = "detail-label";
    title.textContent = label;
    const content = document.createElement("div");
    content.className = "detail-value" + (extraClass ? " " + extraClass : "");
    content.textContent =
        value !== null && value !== undefined && value !== ""
        ? value : "Not available";
    box.append(title,content);
    parent.appendChild(box);
}

function formatDate(value){
    if(!value) return "Not available";
    const parts = String(value).split("-");
    return parts.length === 3
        ? parts[2] + "/" + parts[1] + "/" + parts[0]
        : String(value);
}

function formatTime(value){
    if(!value) return "Not available";
    const parts = String(value).split(":");
    if(parts.length < 2) return String(value);
    let hour = Number(parts[0]);
    const minute = parts[1];
    const suffix = hour >= 12 ? "PM" : "AM";
    hour = hour % 12 || 12;
    return hour + ":" + minute + " " + suffix;
}

function formatBookingDate(value){
    if(!value) return "Not available";
    const date = new Date(value);
    if(Number.isNaN(date.getTime())) return "Not available";
    return date.toLocaleString("en-IN",{
        dateStyle:"medium",
        timeStyle:"short"
    });
}

function updateStats(bookings){
    document.getElementById("totalCount").textContent = bookings.length;
    document.getElementById("pendingCount").textContent =
        bookings.filter(b => b.status === "PENDING").length;
    document.getElementById("confirmedCount").textContent =
        bookings.filter(b => b.status === "CONFIRMED").length;
    document.getElementById("cancelledCount").textContent =
        bookings.filter(b => b.status === "CANCELLED").length;
}

function createEmptyState(title,description,showExplore=false){
    const empty = document.createElement("div");
    empty.className = "empty";
    const icon = document.createElement("div");
    icon.className = "empty-icon";
    icon.textContent = "▣";
    const heading = document.createElement("h2");
    heading.textContent = title;
    const paragraph = document.createElement("p");
    paragraph.textContent = description;
    empty.append(icon,heading,paragraph);
    if(showExplore){
        const link = document.createElement("a");
        link.className = "explore-link";
        link.href = "/movies.html";
        link.textContent = "Explore Movies";
        empty.appendChild(link);
    }
    list.appendChild(empty);
}

function getEvent(booking){
    return allEvents.find(
        event => Number(event.id) === Number(booking.serviceId)
    ) || {};
}

function getHotel(booking){
    return allHotels.find(
        hotel => Number(hotel.id) === Number(booking.serviceId)
    ) || {};
}

function renderBookings(){
    list.replaceChildren();
    const search = searchInput.value.trim().toLowerCase();
    const selectedStatus = statusFilter.value;

    const filtered = allBookings.filter(booking => {
        const show = booking.movieShow || {};
        const movie = show.movie || {};
        const serviceType = String(booking.serviceType || "").toUpperCase();
        const event = serviceType === "EVENT" ? getEvent(booking) : {};
        const hotel = serviceType === "HOTEL" ? getHotel(booking) : {};

        const searchable = [
            booking.bookingReference,
            booking.customerName,
            booking.serviceType,
            movie.title,
            event.name,
            event.category,
            event.venue,
            event.city,
            hotel.name,
            hotel.city,
            hotel.address,
            show.cinemaName,
            show.city,
            show.theaterAddress,
            booking.seats
        ].filter(Boolean).join(" ").toLowerCase();

        return searchable.includes(search) &&
            (selectedStatus === "ALL" || booking.status === selectedStatus);
    });

    if(allBookings.length === 0){
        message.textContent = "";
        createEmptyState(
            "No bookings yet",
            "Your reservations will appear here after you book.",
            true
        );
        return;
    }

    if(filtered.length === 0){
        message.textContent = "";
        createEmptyState(
            "No matching bookings",
            "Try another search term or choose a different status."
        );
        return;
    }

    message.textContent = "Showing " + filtered.length +
        (filtered.length === 1 ? " booking" : " bookings");

    filtered.forEach(booking => {
        const card = document.createElement("article");
        card.className = "booking-card";
        const status = String(booking.status || "PENDING").toUpperCase();
        const show = booking.movieShow || {};
        const movie = show.movie || {};
        const serviceType = String(booking.serviceType || "SERVICE").toUpperCase();
        const event = serviceType === "EVENT" ? getEvent(booking) : {};
        const hotel = serviceType === "HOTEL" ? getHotel(booking) : {};

        const displayTitle =
            movie.title ||
            event.name ||
            event.title ||
            hotel.name ||
            booking.title ||
            booking.serviceName ||
            serviceType + " #" + (booking.serviceId ?? "N/A");

        const reference = booking.bookingReference || "N/A";
        const top = document.createElement("div");
        top.className = "card-header";
        const referenceBox = document.createElement("div");
        const referenceLabel = document.createElement("div");
        referenceLabel.className = "reference-label";
        referenceLabel.textContent = "BOOKING REFERENCE";
        const referenceValue = document.createElement("div");
        referenceValue.className = "reference";
        referenceValue.textContent = reference;
        referenceBox.append(referenceLabel,referenceValue);
        const badge = document.createElement("span");
        badge.className = "status " + status;
        badge.textContent = status;
        top.append(referenceBox,badge);

        const content = document.createElement("div");
        content.className = "card-content";
        const title = document.createElement("h2");
        title.className = "movie-heading";
        title.textContent = displayTitle;
        const subtitle = document.createElement("p");
        subtitle.className = "movie-subtitle";
        subtitle.textContent = serviceType + " reservation";
        content.append(title,subtitle);

        const details = document.createElement("div");
        details.className = "details";
        addDetail(details,"Customer",booking.customerName);

        if(serviceType === "EVENT"){
            addDetail(details,"Event Category",event.category);
            addDetail(details,"Venue",event.venue || event.location || booking.venue);
            addDetail(details,"City",event.city || booking.city);
            addDetail(details,"Event Date",
                event.eventDate ? formatDate(event.eventDate) : "Not available");
            addDetail(details,"Ticket Quantity",
                booking.ticketQuantity ?? booking.quantity ?? "Not available");
        }else if(serviceType === "MOVIE"){
            addDetail(details,"Cinema / Venue",show.cinemaName || booking.venue);
            addDetail(details,"City",show.city || booking.city);
            addDetail(details,"Address",show.theaterAddress);
            addDetail(details,"Show Date",
                show.showDate ? formatDate(show.showDate) : "Not available");
            addDetail(details,"Show Time",
                show.showTime ? formatTime(show.showTime) : "Not available");
            addDetail(details,"Show ID",booking.showId ?? "Not assigned");
            addDetail(details,"Selected Seats",
                booking.seats || "Not applicable","seats");
        }else if(serviceType === "HOTEL"){
            addDetail(details,"Hotel",hotel.name || booking.serviceName);
            addDetail(details,"City",hotel.city || booking.city);
            addDetail(details,"Address",hotel.address || booking.address);
            addDetail(details,"Check-in Date",
                booking.checkInDate ? formatDate(booking.checkInDate) : "Not available");
            addDetail(details,"Check-out Date",
                booking.checkOutDate ? formatDate(booking.checkOutDate) : "Not available");
            addDetail(details,"Rooms",booking.roomQuantity ?? "Not available");
            addDetail(details,"Guests",booking.guestCount ?? "Not available");
            addDetail(details,"Price per Night",
                hotel.pricePerNight != null
                ? "₹" + Number(hotel.pricePerNight).toLocaleString("en-IN")
                : "Not available");
        }else{
            addDetail(details,"Venue",booking.venue);
            addDetail(details,"City",booking.city);
            addDetail(details,"Booking ID",booking.serviceId);
            addDetail(details,"Quantity",
                booking.ticketQuantity ?? booking.quantity ?? "Not available");
        }

        addDetail(
            details,
            "Total Amount",
            "₹" + Number(booking.totalAmount || 0).toLocaleString(
                "en-IN",
                {minimumFractionDigits:2,maximumFractionDigits:2}
            ),
            "amount"
        );
        content.appendChild(details);

        const footer = document.createElement("div");
        footer.className = "card-footer";
        const dateBox = document.createElement("div");
        dateBox.className = "booking-date";
        dateBox.textContent = "Booked on: " + formatBookingDate(booking.bookingTime);

        const cancelButton = document.createElement("button");
        cancelButton.type = "button";
        cancelButton.className = "cancel-btn";

        if(status === "PENDING" || status === "CONFIRMED"){
            cancelButton.textContent = "Cancel Booking";
            cancelButton.addEventListener("click",async()=>{
                if(!confirm("Are you sure you want to cancel booking " + reference + "?")){
                    return;
                }
                cancelButton.disabled = true;
                cancelButton.textContent = "Cancelling...";
                try{
                    const response = await fetch(
                        "/api/bookings/" + encodeURIComponent(reference) + "/cancel",
                        {method:"PUT"}
                    );
                    const responseText = await response.text();
                    let result = {};
                    try{
                        result = responseText ? JSON.parse(responseText) : {};
                    }catch(_){}
                    if(!response.ok){
                        throw new Error(
                            result.message || result.error || "Cancellation failed."
                        );
                    }
                    alert("Booking cancelled successfully.");
                    await loadBookings();
                }catch(error){
                    alert(error.message || "Unable to cancel booking.");
                    cancelButton.disabled = false;
                    cancelButton.textContent = "Cancel Booking";
                }
            });
        }else{
            cancelButton.disabled = true;
            cancelButton.textContent =
                status === "CANCELLED"
                ? "Booking Cancelled"
                : "Cancellation Unavailable";
        }

        const ticketActions = document.createElement("div");
        ticketActions.className = "ticket-actions";
        const viewTicketButton = document.createElement("button");
        viewTicketButton.type = "button";
        viewTicketButton.className = "ticket-btn";
        viewTicketButton.textContent = "View Ticket";
        viewTicketButton.onclick = () => openTicket(booking,false);
        const downloadTicketButton = document.createElement("button");
        downloadTicketButton.type = "button";
        downloadTicketButton.className = "ticket-btn download-ticket";
        downloadTicketButton.textContent = "Download Ticket";
        downloadTicketButton.onclick = () => openTicket(booking,true);
        ticketActions.append(viewTicketButton,downloadTicketButton);
        footer.append(dateBox,cancelButton,ticketActions);
        card.append(top,content,footer);
        list.appendChild(card);
    });
}

function openTicket(booking,download){
    const ticketWindow = window.open("","_blank");
    if(!ticketWindow){
        alert("Please allow pop-ups to view or download your ticket.");
        return;
    }

    const escapeHTML = value =>
        String(value ?? "N/A")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");

    const show = booking.movieShow || {};
    const movie = show.movie || {};
    const serviceType = String(booking.serviceType || "Booking").toUpperCase();
    const event = serviceType === "EVENT" ? getEvent(booking) : {};
    const hotel = serviceType === "HOTEL" ? getHotel(booking) : {};
    const reference = booking.bookingReference || booking.id || "N/A";
    const customer = booking.customerName || "Guest";

    const title = movie.title ||
        event.name ||
        event.title ||
        hotel.name ||
        booking.title ||
        booking.serviceName ||
        serviceType + " booking";

    const seats = Array.isArray(booking.seats)
        ? booking.seats.join(", ")
        : (booking.seats || "Not applicable");

    const amount = Number(booking.totalAmount || 0).toLocaleString(
        "en-IN",
        {minimumFractionDigits:2,maximumFractionDigits:2}
    );

    const showDate = event.eventDate
        ? formatDate(event.eventDate)
        : (show.showDate ? formatDate(show.showDate) : "Not available");

    const showTime = event.eventTime
        ? formatTime(event.eventTime)
        : (show.showTime ? formatTime(show.showTime) : "Not available");

    const venue = hotel.address || hotel.name || show.cinemaName ||
        event.venue ||
        event.location ||
        booking.venue ||
        "Not available";

    const city = hotel.city || show.city || event.city || booking.city || "Not available";
    const ticketQuantity = booking.ticketQuantity ?? booking.quantity ?? 1;
    const status = String(booking.status || "PENDING").toUpperCase();
    const bookingDate = formatBookingDate(booking.bookingTime);

    const qrURL =
        "https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=" +
        encodeURIComponent(reference);

    ticketWindow.document.open();
    ticketWindow.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeatSync Ticket - ${escapeHTML(reference)}</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:25px;background:#f3f4fa;color:#252442;font-family:Arial,sans-serif}
.ticket{max-width:680px;margin:15px auto;padding:28px;background:white;border:2px dashed #5b4bea;border-radius:16px}
.header{text-align:center;border-bottom:1px solid #e9e8f2;padding-bottom:18px}
.logo{color:#5b4bea;font-size:30px;font-weight:bold}
.header p{color:#77778e}
.reference{margin:20px 0;padding:14px;text-align:center;background:#f1efff;border-radius:10px}
.reference strong{display:block;margin-top:8px;font-size:20px;overflow-wrap:anywhere}
.details{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:24px 0}
.label{color:#77778e;font-size:12px;margin-bottom:6px}
.value{font-weight:bold;overflow-wrap:anywhere}
.qr{text-align:center;margin:20px 0}
.qr img{width:150px;height:150px}
.note{color:#77778e;font-size:12px;text-align:center;line-height:1.5}
.print-btn{display:block;margin:20px auto 0;padding:12px 22px;color:white;background:#5b4bea;border:0;border-radius:8px;cursor:pointer;font-weight:bold}
@media print{
body{padding:0;background:white}
.ticket{margin:0 auto}
.print-btn{display:none}
}
@media(max-width:480px){
body{padding:10px}
.ticket{padding:18px}
.details{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="ticket">
<div class="header">
<div class="logo">SeatSync.</div>
<h2>Booking Ticket</h2>
<p>Keep this ticket for your records</p>
</div>
<div class="reference">
BOOKING REFERENCE
<strong>${escapeHTML(reference)}</strong>
</div>
<div class="details">
<div><div class="label">Customer</div><div class="value">${escapeHTML(customer)}</div></div>
<div><div class="label">Service Type</div><div class="value">${escapeHTML(serviceType)}</div></div>
<div><div class="label">Booking</div><div class="value">${escapeHTML(title)}</div></div>
<div><div class="label">Venue / Address</div><div class="value">${escapeHTML(venue)}</div></div>
<div><div class="label">City</div><div class="value">${escapeHTML(city)}</div></div>
${serviceType === "HOTEL" ? `
<div><div class="label">Check-in Date</div><div class="value">${escapeHTML(formatDate(booking.checkInDate))}</div></div>
<div><div class="label">Check-out Date</div><div class="value">${escapeHTML(formatDate(booking.checkOutDate))}</div></div>
<div><div class="label">Rooms</div><div class="value">${escapeHTML(booking.roomQuantity)}</div></div>
<div><div class="label">Guests</div><div class="value">${escapeHTML(booking.guestCount)}</div></div>

async function loadBookings(){
    refreshButton.disabled = true;
    refreshButton.textContent = "Loading...";
    message.textContent = "Loading your bookings...";
    list.replaceChildren();

    try{
        const customerName = getCustomerName();
        if(!customerName){
            throw new Error("Customer name not found. Please log in again.");
        }

        const response = await fetch(
            "/api/bookings/history?customerName=" +
            encodeURIComponent(customerName)
        );

        if(!response.ok){
            throw new Error(
                "Could not load bookings (HTTP " + response.status + ")."
            );
        }

        const bookings = await response.json();
        if(!Array.isArray(bookings)){
            throw new Error("Unexpected booking history response.");
        }

        // Load event details so event bookings show their real event name.
        try{
            const eventResponse = await fetch("/api/events");
            allEvents = eventResponse.ok ? await eventResponse.json() : [];
            if(!Array.isArray(allEvents)) allEvents = [];
        }catch(eventError){
            console.warn("Could not load event details:",eventError);
            allEvents = [];
        }

        // Load hotel details so hotel bookings show the real hotel name and address.
        try{
            const hotelResponse = await fetch("/api/hotels");
            allHotels = hotelResponse.ok ? await hotelResponse.json() : [];
            if(!Array.isArray(allHotels)) allHotels = [];
        }catch(hotelError){
            console.warn("Could not load hotel details:",hotelError);
            allHotels = [];
        }

        allBookings = bookings.slice().sort(
            (a,b) => (b.id || 0) - (a.id || 0)
        );

        updateStats(allBookings);
        renderBookings();

    }catch(error){
        message.textContent =
            error.message || "Unable to load booking history.";
        list.replaceChildren();
        updateStats([]);
    }finally{
        refreshButton.disabled = false;
        refreshButton.textContent = "↻ Refresh Bookings";
    }
}

refreshButton.addEventListener("click",loadBookings);
searchInput.addEventListener("input",renderBookings);
statusFilter.addEventListener("change",renderBookings);
loadBookings();
