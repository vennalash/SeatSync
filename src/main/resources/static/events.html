
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeatSync - Discover Events</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f6ff;
            color: #25204a;
        }

        header {
            background: #25204a;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #bcb5ff;
        }

        .hero {
            background: linear-gradient(120deg, #25204a, #6254e8);
            color: white;
            padding: 65px 8%;
        }

        .hero h2 {
            font-size: 38px;
            margin: 0 0 15px;
        }

        .hero p {
            font-size: 16px;
            color: #e3e0ff;
            line-height: 1.6;
        }

        main {
            padding: 35px 8%;
        }

        .section-heading {
            margin-bottom: 25px;
        }

        .section-heading h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .section-heading p {
            color: #77748e;
        }

        .filters {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .filters input,
        .filters select {
            padding: 13px 15px;
            border: 1px solid #dddbea;
            border-radius: 9px;
            font-size: 14px;
            background: white;
            outline: none;
        }

        .filters input {
            flex: 1;
            min-width: 220px;
        }

        .filters select {
            min-width: 180px;
        }

        .filters input:focus,
        .filters select:focus {
            border-color: #6254e8;
        }

        #message {
            color: #77748e;
            margin-bottom: 20px;
        }

        #eventList {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 25px;
        }

        .event-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 18px #00000012;
            transition: 0.3s;
        }

        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 25px #25204a20;
        }

        .event-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
            background: #e9e6ff;
        }

        .event-content {
            padding: 20px;
        }

        .category {
            display: inline-block;
            background: #efedff;
            color: #6254e8;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .event-card h3 {
            margin: 0 0 16px;
            font-size: 21px;
            color: #25204a;
        }

        .event-info {
            color: #77748e;
            font-size: 14px;
            line-height: 1.8;
            margin: 7px 0;
        }

        .ticket-info {
            background: #f5f4ff;
            border-radius: 9px;
            padding: 12px;
            margin-top: 15px;
        }

        .ticket-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        .available {
            color: #16834b;
            font-weight: bold;
        }

        .sold-out {
            color: #dc2626;
            font-weight: bold;
        }

        .not-updated {
            color: #b7791f;
            font-weight: bold;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eeeef5;
        }

        .price {
            color: #6254e8;
            font-size: 21px;
            font-weight: bold;
        }

        .price small {
            font-size: 11px;
            color: #77748e;
            font-weight: normal;
        }

        .event-card button {
            background: #6254e8;
            color: white;
            border: none;
            padding: 12px 17px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .event-card button:hover {
            background: #493bc5;
        }

        .event-card button:disabled {
            background: #aaa8b8;
            cursor: not-allowed;
        }

        .empty {
            background: white;
            padding: 45px 20px;
            text-align: center;
            border-radius: 14px;
            color: #77748e;
            grid-column: 1 / -1;
        }

        footer {
            background: #25204a;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 50px;
        }

        @media(max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            .hero {
                padding: 45px 6%;
            }

            .hero h2 {
                font-size: 29px;
            }

            main {
                padding: 28px 5%;
            }

            .filters input,
            .filters select {
                width: 100%;
            }

            .price-row {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

<header>
    <h1><a href="/index.html">SeatSync.</a></h1>

    <nav>
        <a href="/index.html">Home</a>
        <a href="/dashboard.html">Dashboard</a>
        <a href="/movies.html">Movies</a>
        <a href="/events.html">Events</a>
        <a href="/history.html">My Bookings</a>
    </nav>
</header>

<section class="hero">
    <h2>Discover Amazing Events</h2>
    <p>
        Concerts, comedy shows, technology expos and more.
        Find your next experience with SeatSync.
    </p>
</section>

<main>

    <div class="section-heading">
        <h2>Upcoming Events</h2>
        <p>Explore and book your favourite events.</p>
    </div>

    <div class="filters">

        <input
            type="search"
            id="searchInput"
            placeholder="Search events by name or venue..."
        >

        <select id="categoryFilter">
            <option value="ALL">All Categories</option>
        </select>

    </div>

    <p id="message">Loading events...</p>

    <div id="eventList"></div>

</main>

<footer>
    © 2026 SeatSync. All Rights Reserved.
</footer>

<script>

const list = document.getElementById("eventList");
const message = document.getElementById("message");
const searchInput = document.getElementById("searchInput");
const categoryFilter = document.getElementById("categoryFilter");

let allEvents = [];

const eventImages = {

    music:
        "https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=900",

    comedy:
        "https://images.unsplash.com/photo-1585699324551-f6c309eedeca?w=900",

    technology:
        "https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=900",

    food:
        "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=900",

    cultural:
        "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=900",

    default:
        "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=900"
};

function getEventImage(event) {

    if (event.imageUrl && event.imageUrl.trim() !== "") {
        return event.imageUrl;
    }

    const key = String(event.category || "").toLowerCase();

    if (key.includes("music") || key.includes("concert")) {
        return eventImages.music;
    }

    if (key.includes("comedy")) {
        return eventImages.comedy;
    }

    if (key.includes("tech")) {
        return eventImages.technology;
    }

    if (key.includes("food")) {
        return eventImages.food;
    }

    if (key.includes("cultural") || key.includes("festival")) {
        return eventImages.cultural;
    }

    return eventImages.default;
}

function formatDate(dateValue) {

    if (!dateValue) {
        return "Date not available";
    }

    const date = new Date(dateValue + "T00:00:00");

    if (isNaN(date.getTime())) {
        return dateValue;
    }

    return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}

function createEventCard(event) {

    const card = document.createElement("div");
    card.className = "event-card";

    // EVENT IMAGE
    const image = document.createElement("img");

    image.className = "event-image";
    image.src = getEventImage(event);
    image.alt = event.name || "Event";
    image.loading = "lazy";

    image.onerror = function() {
        this.onerror = null;
        this.src = eventImages.default;
    };

    const content = document.createElement("div");
    content.className = "event-content";

    // CATEGORY
    const category = document.createElement("span");
    category.className = "category";
    category.textContent = event.category || "General";

    // EVENT NAME
    const title = document.createElement("h3");
    title.textContent = event.name || "Untitled Event";

    // VENUE
    const venue = document.createElement("p");
    venue.className = "event-info";
    venue.textContent =
        "📍 " + (event.venue || "Venue not available");

    // CITY
    const city = document.createElement("p");
    city.className = "event-info";
    city.textContent =
        "🏙️ " + (event.city || "City not available");

    // DATE
    const date = document.createElement("p");
    date.className = "event-info";
    date.textContent =
        "📅 " + formatDate(event.eventDate);

    // TICKET AVAILABILITY
    const ticketInfo = document.createElement("div");
    ticketInfo.className = "ticket-info";

    const total = event.totalTickets;
    const available = event.availableTickets;

    const totalText = document.createElement("p");
    const availableText = document.createElement("p");

    totalText.textContent =
        "Total Tickets: " +
        (total != null ? total : "Not updated");

    let canBook = true;

    if (available == null || available < 0) {

        availableText.textContent =
            "Availability: Not updated";

        availableText.className = "not-updated";
        canBook = false;

    } else if (available === 0) {

        availableText.textContent = "Status: SOLD OUT";
        availableText.className = "sold-out";
        canBook = false;

    } else {

        availableText.textContent =
            "Available Tickets: " + available;

        availableText.className = "available";

    }

    ticketInfo.append(totalText, availableText);

    // PRICE
    const priceRow = document.createElement("div");
    priceRow.className = "price-row";

    const price = document.createElement("div");
    price.className = "price";

    price.textContent =
        event.ticketPrice != null
            ? "₹" + event.ticketPrice
            : "Price N/A";

    const small = document.createElement("small");
    small.textContent = " / ticket";

    price.appendChild(small);

    // BOOK BUTTON
    const button = document.createElement("button");

    button.textContent = canBook
        ? "Book Tickets"
        : available === 0
            ? "Sold Out"
            : "Unavailable";

    button.disabled = !canBook;

    button.onclick = function() {

        window.location.href =
            "/booking.html?type=EVENT&id=" +
            encodeURIComponent(event.id);

    };

    priceRow.append(price, button);

    content.append(
        category,
        title,
        venue,
        city,
        date,
        ticketInfo,
        priceRow
    );

    card.append(image, content);

    return card;
}

// POPULATE CATEGORY FILTER
function populateCategories() {

    const categories = [
        ...new Set(
            allEvents
                .map(event => event.category)
                .filter(Boolean)
        )
    ];

    categoryFilter.innerHTML =
        '<option value="ALL">All Categories</option>';

    categories.forEach(category => {

        const option = document.createElement("option");

        option.value = category;
        option.textContent = category;

        categoryFilter.appendChild(option);

    });
}

// SEARCH AND FILTER
function renderEvents() {

    list.innerHTML = "";

    const search = searchInput.value.toLowerCase().trim();
    const selectedCategory = categoryFilter.value;

    const filteredEvents = allEvents.filter(event => {

        const searchableText = [
            event.name,
            event.category,
            event.venue,
            event.city
        ].filter(Boolean).join(" ").toLowerCase();

        const matchesSearch =
            searchableText.includes(search);

        const matchesCategory =
            selectedCategory === "ALL" ||
            event.category === selectedCategory;

        return matchesSearch && matchesCategory;

    });

    if (filteredEvents.length === 0) {

        message.textContent = "";

        const empty = document.createElement("div");
        empty.className = "empty";

        empty.textContent =
            "No matching events found. Try another search.";

        list.appendChild(empty);

        return;
    }

    message.textContent =
        filteredEvents.length + " event(s) available.";

    filteredEvents.forEach(event => {

        list.appendChild(createEventCard(event));

    });
}

// LOAD EVENTS
async function loadEvents() {

    message.textContent = "Loading events...";
    list.innerHTML = "";

    try {

        const response = await fetch("/api/events");

        if (!response.ok) {
            throw new Error("Could not load events");
        }

        const events = await response.json();

        if (!Array.isArray(events)) {
            throw new Error("Invalid event response");
        }

        // Show active events only
        allEvents = events.filter(event => event.active === true);

        populateCategories();
        renderEvents();

    } catch (error) {

        console.error("Event loading error:", error);

        message.textContent =
            "Unable to load events. Please try again later.";

    }
}

searchInput.addEventListener("input", renderEvents);

categoryFilter.addEventListener("change", renderEvents);

loadEvents();

</script>

</body>
</html>
